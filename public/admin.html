<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Next?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="admin.html">
        <img src="imagenes/logo-cut.png" alt="Logo Next?" height="35" class="bg-white rounded p-1">
        <span>Next? | Administración</span>
      </a>
      <div class="d-flex gap-2">
        <a href="crear-turno.html" class="btn btn-outline-light btn-sm">Ir a Crear Turno</a>
        <a href="atencion-turnos.html" class="btn btn-outline-light btn-sm">Ir a Atención</a>
        <button onclick="cerrarSesion()" class="btn btn-danger btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold text-primary">Gestión y Aprobación de Usuarios</h5>
        <button class="btn btn-sm btn-outline-primary" onclick="cargarUsuarios()">Actualizar lista</button>
      </div>
      <div class="card-body">
        <div id="alertaAdmin" class="alert d-none" role="alert"></div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Nombre Completo</th>
                <th>Cédula</th>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Estado</th>
                <th>Asignar Rol</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaUsuarios">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">Cargando usuarios...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/admin-controller.js"></script>
</body>
</html>
