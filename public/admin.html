<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Next?</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

  <header class="header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="imagenes/logo-cut.png" alt="Logo Next?">
      <h2>Next?</h2>
    </div>

    <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
      <a href="crear-turno.html">Crear turno</a>
      <a href="atencion-turnos.html">Atención de turnos</a>
      <button onclick="cerrarSesion()" class="btn-eliminar" style="width: auto; padding: 8px 16px; margin: 0;">
        Cerrar sesión
      </button>
    </div>
  </header>

  <div class="contenedor-turno" style="max-width: 760px;">

    <h1>Administración de usuarios</h1>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 style="margin: 0;">Solicitudes y cuentas registradas</h3>
      <button onclick="cargarUsuarios()" style="width: auto; padding: 10px 18px; font-size: 14px;">
        Actualizar lista
      </button>
    </div>

    <!-- MENSAJE DE NOTIFICACIÓN -->
    <div id="alertaAdmin" style="display: none; padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; font-size: 14px;"></div>

    <!-- LISTA DE USUARIOS -->
    <div class="lista-espera" id="listaUsuarios">
      <div class="card" style="max-width: 100%;">
        <p style="margin: 0; color: #6c757d;">Cargando usuarios...</p>
      </div>
    </div>

  </div>

  <script src="/js/admin-controller.js"></script>

</body>

</html>
