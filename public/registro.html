<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body class="center">

  <div class="card">

    <img src="imagenes/logo-cut.png" alt="Logo Next?">

    <div class="form">

      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" placeholder="Ingrese su apellido">

      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" placeholder="Ingrese su nombre">

      <label for="cedula">Número de cédula:</label>
      <input type="text" id="cedula" placeholder="Ingrese su número de cédula">

      <label for="fecha">Fecha de nacimiento:</label>
      <input type="date" id="fecha">

      <label for="usuario">Usuario:</label>
      <input type="text" id="usuario" placeholder="Ingrese su usuario">

      <label for="password">Contraseña:</label>
      <input type="password" id="password" placeholder="Ingrese su contraseña">

      <button class="btn-form" onclick="registrarUsuario()">Registrarse</button>
      <p id="mensaje"></p>

      <p class="link-text">
        ¿Ya tienes cuenta?
        <a href="login.html">Iniciar sesión</a>
      </p>

    </div>

  </div>
<script src="/js/registro-controller.js"></script>
</body>

</html>
