<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar turno - Next?</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body class="center">

  <div class="card turno-card">

    <img src="imagenes/logo-cut.png" alt="Logo Next?">

    <h2>Cancelar turno</h2>

    <p id="textoConfirmacion">
      ¿Está seguro que desea cancelar su turno? Esta acción no se puede deshacer.
    </p>

    <button id="btnSi" class="btn-cancelar" onclick="confirmarCancelacion()">
      Sí, cancelar turno
    </button>

    <button id="btnNo" class="btn-form" onclick="volver()">
      No, volver
    </button>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    async function confirmarCancelacion() {
      if (!token) {
        alert("Token de turno no válido.");
        return;
      }

      try {
        const res = await fetch(`/turnos/cancelar/${token}`, {
          method: "PUT",
        });

        const datos = await res.json();

        if (!res.ok) {
          alert(datos.mensaje || "No se pudo cancelar el turno.");
          return;
        }

        alert(datos.mensaje);
        window.location.href = `visualizar-turno.html?token=${token}`;
      } catch (error) {
        console.error(error);
        alert("Error de conexión con el servidor.");
      }
    }

    function volver() {
      if (token) {
        window.location.href = `visualizar-turno.html?token=${token}`;
      } else {
        window.history.back();
      }
    }
  </script>

</body>

</html>
