<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear turno</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

  <!-- ENCABEZADO -->
  <header class="header">
    <img src="imagenes/logo-cut.png" alt="Logo Next?">
    <h2>Next?</h2>
  </header>

  <div class="contenedor-turno">

    <h1>Crear turno</h1>

    <h3>Servicios disponibles</h3>

    <!-- SERVICIOS -->
    <div class="servicios">

      <div class="servicio" onclick="mostrarFormulario('Trámite 1')">
        <h3>Trámite 1</h3>
        <p>Seleccione este servicio</p>
      </div>

      <div class="servicio" onclick="mostrarFormulario('Trámite 2')">
        <h3>Trámite 2</h3>
        <p>Seleccione este servicio</p>
      </div>

    </div>

    <!-- FORMULARIO -->
    <div id="formulario" class="card formulario-turno" style="display:none;">

      <h2 id="tituloServicio"></h2>

      <form class="form" action="/turnos" method="POST">

        <!-- Se envía automáticamente el trámite seleccionado -->
        <input type="hidden" id="tramite" name="tramite">

        <label>Apellido:</label>
        <input type="text" placeholder="Ingrese su apellido">

        <label>Nombre:</label>
        <input type="text" name="nombre" placeholder="Ingrese su nombre" required>

        <label>Número de cédula:</label>
        <input type="text" name="cedula" placeholder="Ingrese su cédula" required>

        <label>Fecha de nacimiento:</label>
        <input type="date">

        <label>Usuario:</label>
        <input type="text" placeholder="Ingrese su usuario">

        <label>Prioridad:</label>

        <select>
          <option value="">Seleccione prioridad</option>
          <option>Normal</option>
          <option>Preferencial</option>
          <option>Urgente</option>
        </select>

        <button type="submit" class="btn-form">
          Crear turno
        </button>

      </form>

    </div>

  </div>

  <script>

    function mostrarFormulario(servicio) {

      document.getElementById("formulario").style.display = "block";

      document.getElementById("tituloServicio").innerHTML = servicio;

      document.getElementById("tramite").value = servicio;

    }

  </script>

</body>

</html>
